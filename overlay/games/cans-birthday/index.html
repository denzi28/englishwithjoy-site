<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can's Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2340;--muted:#6f6585;--line:#e9dfcf;--ok:#2fb36d;--okd:#1f8a52;--bad:#e5484d;--p:#8e5cf7;--pd:#6b3fd4;--yel:#ffcb3d;--yeld:#d39a00;--pink:#f2547d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2b2340}
body{font-family:Fredoka,"Trebuchet MS",Arial,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:none}
img{-webkit-user-drag:none;user-select:none}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#fdf6ec}
#top{position:absolute;left:0;top:0;right:0;height:88px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:3px solid var(--line);background:#fffaf2;z-index:20}
#top h1{margin:0 18px 0 6px;font-size:32px;white-space:nowrap}
.ibtn{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink);text-decoration:none;flex:none}
.ibtn svg{width:28px;height:28px}
#dots{display:flex;gap:8px;margin-right:auto}
#dots i{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);background:#fff}
#dots i.on{background:var(--yel);border-color:var(--yeld)}
#dots i.now{border-color:var(--p);box-shadow:0 0 0 4px #e6dcff}
.score{display:flex;align-items:center;gap:8px;font-size:28px;font-weight:700;padding:0 16px;height:58px;border-radius:29px;background:#fff;border:3px solid var(--line)}
.score svg{width:34px;height:34px}
.score.ty{background:#fff4cc;border-color:#f1c84b}.score.tp{background:#efe6ff;border-color:#c4adf7}
.score.turn{box-shadow:0 0 0 5px var(--p)}
.score.pop{animation:pop .45s}
.screen{position:absolute;left:0;top:88px;width:1600px;height:812px;display:none}
.screen.on{display:block;animation:fadein .35s}
/* title */
#title{background:linear-gradient(#fff3d6,#fde3ec)}
#title h2{position:absolute;left:0;right:0;top:40px;margin:0;text-align:center;font-size:96px;line-height:1;color:var(--pink);text-shadow:0 6px 0 #fff}
#title p{position:absolute;left:0;right:0;top:150px;margin:0;text-align:center;font-size:34px;color:var(--muted)}
#cast{position:absolute;left:150px;right:150px;top:200px;height:390px;display:flex;justify-content:space-between;align-items:flex-end}
#cast img{height:330px;filter:drop-shadow(0 10px 6px rgba(43,35,64,.15))}
#cast img.kid{height:270px}
#modes{position:absolute;left:0;right:0;bottom:56px;display:flex;justify-content:center;gap:40px}
.big{height:112px;padding:0 44px;border-radius:56px;border:5px solid var(--ink);background:#fff;font-size:42px;font-weight:700;box-shadow:0 8px 0 var(--ink);display:flex;align-items:center;gap:14px}
.big.go{background:var(--ok);border-color:var(--okd);color:#fff;box-shadow:0 8px 0 var(--okd)}
.big.pur{background:var(--p);border-color:var(--pd);color:#fff;box-shadow:0 8px 0 var(--pd)}
.big:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
/* cutscene */
#cut{background:#000}
#set{position:absolute;inset:0;overflow:hidden}
#set svg.bg{position:absolute;inset:0;width:1600px;height:900px}
#vid{position:absolute;inset:0;width:1600px;height:900px;background:#000;display:none;object-fit:cover}
#cut.video #vid{display:block}#cut.video #set{display:none}
#vid{transition:opacity .4s}#cut.loading #vid{opacity:0}#cut.loading #set{visibility:hidden}
#cut.loading .cutbar,#cut.loading #placeTag{visibility:hidden}
.actor{position:absolute;bottom:40px;height:470px;transform-origin:50% 100%;transition:left 1.4s cubic-bezier(.45,.05,.4,1),transform .3s;filter:drop-shadow(0 12px 6px rgba(43,35,64,.18))}
.actor.kid{height:380px}
.actor.flip{transform:scaleX(-1)}
.actor.talk{animation:talk .5s ease-in-out infinite alternate}
.actor.flip.talk{animation:talkf .5s ease-in-out infinite alternate}
#bub{position:absolute;z-index:6;background:#fff;border:5px solid var(--ink);border-radius:30px;padding:14px 28px;font-size:44px;font-weight:600;white-space:nowrap;opacity:0;transform:translateX(-50%) scale(.6);transition:opacity .2s,transform .25s;pointer-events:none;box-shadow:0 6px 0 rgba(43,35,64,.25)}
#bub.on{opacity:1;transform:translateX(-50%)}
#bub::after{content:"";position:absolute;left:50%;bottom:-24px;margin-left:-12px;border:12px solid transparent;border-top:18px solid var(--ink)}
.cutbar{position:absolute;right:30px;bottom:26px;display:flex;gap:18px;z-index:8}
.cutbar .big{height:90px;font-size:36px;padding:0 34px}
.cutbar .big.hide{display:none}
#placeTag{position:absolute;left:30px;top:110px;z-index:7;background:rgba(255,255,255,.92);border:4px solid var(--ink);border-radius:24px;padding:6px 22px;font-size:32px;font-weight:700}
/* activity */
#act{background:linear-gradient(#fffaf2,#fdf1e2)}
#qbar{display:flex;align-items:center;gap:16px;background:rgba(43,35,64,.66);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:3px solid rgba(255,255,255,.4);border-radius:30px;padding:14px 22px;color:#fff;box-shadow:0 10px 30px rgba(20,14,40,.25)}
#qtext{font-size:38px;font-weight:700;flex:1;line-height:1.15}
.say{width:70px;height:70px;border-radius:50%;border:4px solid var(--ink);background:var(--yel);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.say svg{width:36px;height:36px}
#turn{font-size:30px;font-weight:700;padding:8px 20px;border-radius:22px;display:none;white-space:nowrap}
#turn.ty{display:block;background:#fff4cc;border:3px solid #f1c84b}#turn.tp{display:block;background:#efe6ff;border:3px solid #c4adf7}
#area{position:absolute;left:0;top:0;width:1600px;height:900px}
.next{position:absolute;right:46px;bottom:30px;height:90px;padding:0 34px;border-radius:45px;border:5px solid var(--okd);background:var(--ok);color:#fff;font-size:38px;font-weight:700;display:none;align-items:center;gap:10px;box-shadow:0 7px 0 var(--okd);z-index:9}
.next.on{display:flex;animation:pop .5s}
.next svg{width:34px;height:34px}
.opts{position:absolute;display:flex;flex-direction:column;gap:22px}
.opt{min-height:100px;border-radius:30px;border:5px solid var(--ink);background:#fff;font-size:42px;font-weight:600;box-shadow:0 7px 0 var(--ink);text-align:left;padding:0 34px;display:flex;align-items:center;gap:18px}
.opt .sw{width:46px;height:46px;border-radius:50%;border:4px solid var(--ink);flex:none}
.opt.ok{background:var(--ok);border-color:var(--okd);color:#fff;box-shadow:0 7px 0 var(--okd)}
.opt.no{background:#ffe3e4;border-color:var(--bad);color:#a3272b;box-shadow:0 7px 0 var(--bad);animation:shake .45s}
.opt.dim{opacity:.35}
.opt.pick{background:#fff1b8;border-color:var(--yeld);box-shadow:0 7px 0 var(--yeld)}
.card{position:absolute;border:5px solid var(--ink);border-radius:30px;background:#fff;box-shadow:0 7px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px;font-size:36px;font-weight:700;overflow:hidden}
.card img,.card svg{display:block}
.card.ok{border-color:var(--okd);box-shadow:0 7px 0 var(--okd);background:#e3f7ea}
.card.no{border-color:var(--bad);box-shadow:0 7px 0 var(--bad);background:#ffe3e4;animation:shake .45s}
.card.sel{background:#fff1b8;transform:translateY(-8px)}
.chip{position:absolute;height:96px;padding:0 34px;border-radius:48px;border:5px solid var(--ink);background:#fff;font-size:42px;font-weight:700;box-shadow:0 7px 0 var(--ink);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.chip.sel{background:#fff1b8;transform:translateY(-8px)}
.chip.lift{opacity:.25}.chip.used{visibility:hidden}
.ghost{position:absolute;z-index:50;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg) scale(1.06);margin:0;box-shadow:0 16px 26px rgba(43,35,64,.3)}
.ctl{height:100px;padding:0 34px;border-radius:30px;border:5px solid var(--ink);background:#fff;font-size:38px;font-weight:700;box-shadow:0 7px 0 var(--ink);display:flex;align-items:center;gap:12px}
.ctl:active,.opt:active,.chip:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.ctl.go{background:var(--ok);border-color:var(--okd);color:#fff;box-shadow:0 7px 0 var(--okd)}
.ctl svg{width:44px;height:44px}
#fb{position:absolute;left:50%;top:300px;transform:translate(-50%,-50%) scale(.5);font-size:84px;font-weight:700;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;opacity:0;pointer-events:none;z-index:30;white-space:nowrap;transition:.25s}
#fb.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#fb.good{color:var(--ok)}#fb.bad{color:#ff8a8a}
.wag{position:absolute;width:250px;height:150px;border:5px solid var(--ink);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:700;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.wag::before,.wag::after{content:"";position:absolute;bottom:-34px;width:52px;height:52px;border-radius:50%;background:#555;border:5px solid var(--ink)}
.wag::before{left:30px}.wag::after{right:30px}
.wag.slot{background:#fff!important;border-style:dashed;color:var(--muted);text-shadow:none;font-size:70px}
.wag.slot.hot{background:#fff6cf!important}
#train{position:absolute;left:0;top:30px;width:1600px;height:260px;transition:transform 2.2s cubic-bezier(.5,0,.6,1)}
.balloon{position:absolute;width:110px;height:140px;cursor:pointer}
.balloon svg{width:110px;height:200px;overflow:visible}
.balloon b{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:46px;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;pointer-events:none}
.balloon.float{animation:bob 2.4s ease-in-out infinite alternate}
.balloon.popd{animation:popd .3s forwards;pointer-events:none}
.balloon.wob{animation:shake .45s}
#fx{position:absolute;left:0;top:0;pointer-events:none;z-index:40}
#toast{position:absolute;pointer-events:none;left:50%;top:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 26px;border-radius:18px;font-size:24px;opacity:0;transition:.3s;z-index:60;max-width:1200px;text-align:center}
#toast.on{opacity:1}
/* the film fills the whole frame; the top bar floats over it as frosted glass */
#cut,#act{top:0;height:900px}
#stage.film #top{left:14px;right:14px;top:12px;height:76px;border:0;border-radius:40px;padding:0 12px;background:rgba(255,250,242,.55);-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);box-shadow:0 6px 24px rgba(20,14,40,.16)}
#stage.film #top h1{font-size:28px}
#stage.film .ibtn{width:52px;height:52px;background:rgba(255,255,255,.75);border-color:rgba(43,35,64,.15)}
#stage.film .score{height:52px;background:rgba(255,255,255,.75)}
#stage.film #dots i{width:22px;height:22px;background:rgba(255,255,255,.7)}
#stage.film #dots i.on{background:var(--yel)}
/* questions on top of the paused video: a translucent dock at the side or along the bottom, so what the
   question is about stays in view */
#act.ov{background:transparent;pointer-events:none;z-index:5}
#act.ov #area>*,#act.ov .next{pointer-events:auto}
#act.ov #area{pointer-events:none}
#dock{position:absolute;display:flex;flex-direction:column;gap:16px;z-index:6;pointer-events:none;animation:fadein .3s}
#dock>*{pointer-events:auto}
#act.dk-right #dock{right:28px;top:112px;width:max-content;min-width:360px;max-width:440px}
#act.dk-left #dock{left:28px;top:112px;width:max-content;min-width:380px;max-width:560px}
#act.dk-bottom #dockOpts{align-self:stretch}
#act.dk-bottom #dock{left:60px;right:60px;bottom:26px;align-items:center}
#act.dk-top #dock{left:50%;top:108px;transform:translateX(-50%);width:max-content;max-width:1300px}
#act.dk-train #dock{left:50%;top:400px;transform:translateX(-50%);width:max-content;max-width:1300px}
#dockOpts:empty{display:none}
#dockOpts .opts{position:static;display:flex;flex-direction:column;gap:14px}
#act.dk-bottom #dockOpts .opts{flex-direction:row;flex-wrap:wrap;justify-content:center}
#dock .opt{min-height:84px;font-size:35px;border-width:4px;border-radius:26px;padding:0 26px;background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-color:rgba(43,35,64,.85);box-shadow:0 5px 0 rgba(43,35,64,.85),0 12px 24px rgba(20,14,40,.2);white-space:nowrap}
#dock .opt .sw{width:40px;height:40px}
#dock .opt.ok{background:var(--ok);border-color:var(--okd);box-shadow:0 5px 0 var(--okd)}
#dock .opt.no{background:#ffe3e4;border-color:var(--bad);box-shadow:0 5px 0 var(--bad)}
#dock .opt.pick{background:#fff1b8;border-color:var(--yeld);box-shadow:0 5px 0 var(--yeld)}
#dock .opt.dim{opacity:.3}
.glass{position:absolute;background:rgba(255,250,242,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:3px solid rgba(255,255,255,.7);border-radius:34px;box-shadow:0 12px 34px rgba(20,14,40,.22)}
.chiprow{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.chiprow .chip{position:relative;height:86px;font-size:38px;padding:0 30px}
.cutbar .big{background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.cutbar .big.go{background:var(--ok)}
#cut.asking .cutbar,#cut.asking #placeTag{display:none}
#cut.asking #vid{filter:saturate(.9) brightness(.96)}
.opts.row{left:30px;right:30px;bottom:26px;flex-direction:row;justify-content:center;flex-wrap:wrap;gap:22px}
.opts.row .opt{padding:0 30px;font-size:40px}
#act.ov .opts:not(.row) .opt{font-size:38px;white-space:nowrap;padding:0 28px}
.panel{position:absolute;background:rgba(255,250,242,.93);border:4px solid var(--ink);border-radius:34px;box-shadow:0 10px 30px rgba(20,14,40,.25)}
.invite{position:absolute;left:270px;top:196px;width:1060px;height:486px;background-color:rgba(255,250,242,.94);border:6px solid var(--ink);border-radius:40px;box-shadow:0 10px 0 var(--ink),0 18px 40px rgba(20,14,40,.3);padding:26px 60px;background-image:radial-gradient(circle at 8% 12%,#ffcb3d 0 18px,transparent 19px),radial-gradient(circle at 93% 16%,#f2547d 0 16px,transparent 17px),radial-gradient(circle at 90% 88%,#5aa9e6 0 18px,transparent 19px),radial-gradient(circle at 6% 86%,#2fb36d 0 15px,transparent 16px)}
.inv-top{text-align:center;font-size:62px;font-weight:700;color:var(--pink);margin-bottom:12px}
.inv-line{font-size:48px;font-weight:600;line-height:1;margin:20px 0;white-space:nowrap}
.inv-end{text-align:center;font-size:44px;font-weight:700;color:var(--p);margin-top:26px}
.slot{display:inline-block;min-width:240px;padding:8px 22px;margin:0 6px;border:5px dashed var(--muted);border-radius:24px;text-align:center;color:var(--muted);background:#fff;vertical-align:middle}
.slot.hot{background:#fff6cf;border-color:var(--yeld)}
.slot.done{border-style:solid;border-color:var(--okd);background:#e3f7ea;color:var(--ink)}
.slot.no{border-color:var(--bad);background:#ffe3e4;animation:shake .45s}
/* end */
#end{background:linear-gradient(#fff3d6,#fde3ec)}
#end h2{position:absolute;left:0;right:0;top:40px;margin:0;text-align:center;font-size:90px;color:var(--pink);text-shadow:0 6px 0 #fff}
#endScore{position:absolute;left:0;right:0;top:170px;text-align:center;font-size:48px;font-weight:700}
#endCast{position:absolute;left:120px;right:120px;top:250px;height:360px;display:flex;justify-content:space-between;align-items:flex-end}
#endCast img{height:320px;animation:hop .6s ease-in-out infinite alternate}
#endCast img.kid{height:260px}
#endCast img:nth-child(2n){animation-delay:.3s}
#end .big{position:absolute;left:50%;bottom:50px;transform:translateX(-50%)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes talk{from{transform:translateY(0)}to{transform:translateY(-8px) rotate(-1deg)}}
@keyframes talkf{from{transform:scaleX(-1) translateY(0)}to{transform:scaleX(-1) translateY(-8px) rotate(-1deg)}}
@keyframes bob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-18px) rotate(2deg)}}
@keyframes popd{0%{transform:scale(1)}50%{transform:scale(1.3);opacity:.6}100%{transform:scale(0);opacity:0}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-22px)}}
@keyframes flick{from{transform:scaleY(1) translateY(0)}to{transform:scaleY(1.15) translateY(-2px)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .25s ease-in-out infinite alternate}
</style>
</head>
<body>
<div id="stage">
  <div id="top">
    <a class="ibtn" href="../../" title="Back to Englishwithjoy" id="homeBtn"></a>
    <h1>Can's Birthday</h1>
    <div id="dots"></div>
    <div class="score" id="sAll"><span id="sAllIc"></span><span id="sAllN">0</span></div>
    <div class="score ty" id="sY" style="display:none"><span class="ic"></span><span id="sYN">0</span></div>
    <div class="score tp" id="sP" style="display:none"><span class="ic"></span><span id="sPN">0</span></div>
    <button class="ibtn" id="sndBtn" title="Sound on or off"></button>
    <button class="ibtn" id="fsBtn" title="Full screen"></button>
  </div>

  <div id="title" class="screen on">
    <h2>Can's Birthday</h2>
    <p>A story game. Help Can on his special day!</p>
    <div id="cast"></div>
    <div id="modes">
      <button class="big go" id="mClass"></button>
      <button class="big pur" id="mTeams"></button>
    </div>
  </div>

  <div id="cut" class="screen">
    <div id="set"><svg class="bg" id="bgsvg" viewBox="0 0 1600 812"></svg><div id="actors"></div><div id="bub"></div><div id="placeTag"></div></div>
    <video id="vid" playsinline preload="auto"></video>
    <div class="cutbar">
      <button class="big" id="replay"></button>
      <button class="big go hide" id="goBtn"></button>
    </div>
  </div>

  <div id="act" class="screen">
    <div id="area"></div>
    <div id="dock"><div id="qbar"><button class="say" id="qsay" title="Listen again"></button><div id="qtext"></div><div id="turn"></div></div><div id="dockOpts"></div></div>
    <button class="next" id="next"></button>
  </div>

  <div id="end" class="screen">
    <h2>Happy birthday, Can!</h2>
    <div id="endScore"></div>
    <div id="endCast"></div>
    <button class="big go" id="again"></button>
  </div>

  <div id="fb"></div>
  <canvas id="fx" width="1600" height="900"></canvas>
  <div id="toast"></div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const wait = (ms) => new Promise((ok) => setTimeout(ok, ms));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ------------------------------------------------------------ icons */
const IC = {
  home: `<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>`,
  sound: `<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
  mute: `<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`,
  fs: `<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
